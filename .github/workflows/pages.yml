name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create package ZIP files
        run: |
          # Create visualizer-test v1.0.0 ZIP from git history
          git archive --format=zip --output=dev.nekoare.vrc-expression-menu-visualizer-test-1.0.0.zip 176ed88:Packages/dev.nekoare.vrc-expression-menu-visualizer-test

          # Create visualizer-test v1.1.0 ZIP (exclude .meta files)
          cd Packages/dev.nekoare.vrc-expression-menu-visualizer-test
          zip -r ../../dev.nekoare.vrc-expression-menu-visualizer-test-1.1.0.zip . -x "*.meta"
          cd ../..

          # Create organizer-beta v1.0.0 ZIP (exclude .meta files)
          cd Packages/dev.nekoare.vrc-expression-menu-organizer-beta
          zip -r ../../dev.nekoare.vrc-expression-menu-organizer-beta-1.0.0.zip . -x "*.meta"
          cd ../..

      - name: Calculate ZIP hashes and update index.json
        run: |
          # Calculate hash for visualizer-test v1.0.0
          HASH_1_0_0=$(sha256sum dev.nekoare.vrc-expression-menu-visualizer-test-1.0.0.zip | cut -d' ' -f1)
          echo "Visualizer v1.0.0 hash: $HASH_1_0_0"
          sed -i "s/PLACEHOLDER_HASH_1_0_0/$HASH_1_0_0/g" index.json

          # Calculate hash for visualizer-test v1.1.0
          HASH_1_1_0=$(sha256sum dev.nekoare.vrc-expression-menu-visualizer-test-1.1.0.zip | cut -d' ' -f1)
          echo "Visualizer v1.1.0 hash: $HASH_1_1_0"
          sed -i "s/PLACEHOLDER_HASH_1_1_0/$HASH_1_1_0/g" index.json

          # Calculate hash for organizer-beta v1.0.0
          HASH_ORGANIZER=$(sha256sum dev.nekoare.vrc-expression-menu-organizer-beta-1.0.0.zip | cut -d' ' -f1)
          echo "Organizer v1.0.0 hash: $HASH_ORGANIZER"
          sed -i "s/PLACEHOLDER_HASH_ORGANIZER_1_0_0/$HASH_ORGANIZER/g" index.json

          echo "Updated index.json with all hashes"
        
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
